name: Release

# Runs when scripts/release.py's tag is pushed (git push origin main --follow-tags).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches plugin.json version
        run: python3 scripts/build.py verify-tag "$GITHUB_REF_NAME"
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Generated files are current
        run: python3 scripts/build.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
      - name: Build claude.ai skill zips
        run: python3 scripts/build.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build.py notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
